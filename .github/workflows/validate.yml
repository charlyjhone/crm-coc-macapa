name: Validate CRM

on:
  pull_request:
  push:
    branches:
      - codex/seguranca-e-limpeza-crm-escolar

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (technical-debt report)
        continue-on-error: true
        run: npm run lint

      - name: Production build
        run: npm run build
