name: TMP screens (layout check)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Shots
        run: |
          npx vite preview --port 4173 --strictPort &
          sleep 4
          cat > /tmp/shots.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 1440, height: 900 } });
          const errors = [];
          p.on("pageerror", (e) => errors.push(String(e)));
          p.on("console", (m) => { if (m.type() === "error") errors.push(m.text()); });
          const shot = async (name, url, act) => {
            await p.goto("http://localhost:4173" + url, { waitUntil: "networkidle" });
            await p.waitForTimeout(1500);
            if (act) { await act(); await p.waitForTimeout(900); }
            const buf = await p.screenshot({ fullPage: true, type: "jpeg", quality: 55 });
            const b64 = buf.toString("base64");
            console.log(`@@SHOT ${name} ${b64.length}`);
            for (let i = 0; i < b64.length; i += 4000) console.log("@@D " + name + " " + b64.slice(i, i + 4000));
            console.log(`@@END ${name}`);
          };
          await shot("inicio", "/hoje?demo=1");
          await shot("classificar", "/hoje", async () => { await p.getByRole("button", { name: "Classificar" }).first().click(); });
          await shot("funil", "/funil?ficha=op-7");
          await shot("funil-novo", "/funil?ficha=op-1");
          await shot("conversas", "/atendimentos?aba=todas&lead=demo-2");
          await shot("conversas-sem-funil", "/atendimentos?aba=todas&lead=demo-9");
          await shot("relatorios", "/direcao");
          await p.setViewportSize({ width: 390, height: 844 });
          await shot("mobile-inicio", "/hoje");
          console.log("@@ERRORS " + JSON.stringify(errors.slice(0, 20)));
          await b.close();
          JS
          node /tmp/shots.mjs
